version: 1

chains:
  ethereum:
    id: 1
    rpc: "${ETHEREUM_WS_RPC_URL}"
  polygon:
    id: 137
    rpc: "${POLYGON_WS_RPC_URL}"

sources:
  - name: usdc
    abi: ./abis/IERC20.json
    deployments:
      ethereum:
        addresses:
          - "0xA0b86991c6218b36c1d19d4a2e9Eb0cE3606eB48"
      polygon:
        addresses:
          - "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
    events:
      - name: Transfer
        # Match clauses are OR: transfers from or to this address.
        match:
          - from: ["${WATCHED_ADDRESS}"]
          - to: ["${WATCHED_ADDRESS}"]
      - name: Approval
        match:
          - owner: ["${WATCHED_ADDRESS}"]
