version: 1

chains:
  ethereum:
    id: 1
    rpc: "${ETHEREUM_WS_RPC_URL}"

sources:
  - name: uniswap-v3-factory
    abi: ./abis/IUniswapV3Factory.json
    deployments:
      ethereum:
        addresses:
          - "0x1F98431c8aD98523631AE4a59f267346ea31F984"
    events:
      - name: PoolCreated
        match:
          # Mainnet USDC/WETH pools with 0.05% fee.
          - token0: ["0xA0b86991c6218b36c1d19d4a2e9Eb0cE3606eB48"]
            token1: ["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"]
            fee: [500]

  - name: uniswap-v3-pools
    abi: ./abis/IUniswapV3Pool.json
    deployments:
      ethereum:
        addresses:
          # Mainnet USDC/WETH 0.05% pool.
          - "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"
    events:
      - name: Swap
